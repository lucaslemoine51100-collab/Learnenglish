name: Vérification sur Mac

# Vérifie, sur une machine macOS de GitHub (gratuite pour un dépôt public) :
#  1. les tests unitaires de la logique (CoreTests) ;
#  2. que l'app Swift Playgrounds compile pour le simulateur iPad.
on:
  push:
    paths:
      - "AssistantComics.swiftpm/**"
      - "CoreTests/**"
      - ".github/workflows/verification.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Tests de la logique
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Choisir la version la plus récente de Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Copier le code testé
        run: cp AssistantComics.swiftpm/Core/*.swift CoreTests/Sources/ComicsCore/
      - name: Lancer les tests
        working-directory: CoreTests
        run: swift test

  app-build:
    # Swift Playgrounds n'utilise pas forcément le même SDK ni le même mode de langage que le Xcode le plus récent :
    # on compile donc plusieurs variantes pour repérer les incompatibilités.
    name: Compilation (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Xcode récent, simulateur"
            runner: macos-latest
            xcode: "latest"
            destination: "generic/platform=iOS Simulator"
            extra: ""
          - label: "Xcode 16, SDK iOS 18"
            runner: macos-15
            xcode: "16"
            destination: "generic/platform=iOS Simulator"
            extra: ""
          - label: "Swift 6 strict, iPad réel"
            runner: macos-latest
            xcode: "latest"
            destination: "generic/platform=iOS"
            extra: "SWIFT_VERSION=6 SWIFT_STRICT_CONCURRENCY=complete"
    steps:
      - uses: actions/checkout@v5
      - name: Choisir Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          if [ "${{ matrix.xcode }}" = "latest" ]; then
            XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          else
            XCODE=$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app | grep -v -i beta | sort -V | tail -1)
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i -E "iphoneos|iphonesimulator" || true
      - name: Lister les schémas
        working-directory: AssistantComics.swiftpm
        run: xcodebuild -list
      - name: Compiler
        working-directory: AssistantComics.swiftpm
        run: |
          xcodebuild build \
            -scheme "Assistant Comics" \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO ${{ matrix.extra }} \
            > "$RUNNER_TEMP/build.log" 2>&1 && STATUS=0 || STATUS=$?
          echo "::group::Erreurs et avertissements"
          grep -E "error:|warning:" "$RUNNER_TEMP/build.log" | grep -v appintentsmetadataprocessor | sort -u | head -300 || true
          echo "::endgroup::"
          tail -25 "$RUNNER_TEMP/build.log"
          exit $STATUS
